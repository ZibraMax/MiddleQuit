name: xcode

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1"

      - name: Build
        run: |
          xcodebuild \
            -project Xcode/MiddleQuit.xcodeproj \
            -scheme MiddleQuit \
            -configuration Release \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate .app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d -name "MiddleQuit.app" \
            -path "*Build/Products/Release*" \
            | head -n 1)"

          if [[ -z "${APP_PATH}" ]]; then
            echo "MiddleQuit.app not found in DerivedData."
            echo "Dumping Build/Products directories for debugging:"
            find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path "*Build/Products*" | head -n 200  # limit output to avoid log flooding
            exit 1
          fi

          echo "Found app at: ${APP_PATH}"
          echo "APP_PATH=${APP_PATH}" >> "$GITHUB_ENV"

      - name: Zip .app bundle
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "${APP_PATH}" /tmp/MiddleQuit.app.zip
          echo "ZIP_PATH=/tmp/MiddleQuit.app.zip" >> "$GITHUB_ENV"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiddleQuit.app
          path: ${{ env.ZIP_PATH }}

